<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4 landscape; margin: 2cm; }
        body { font-family: 'Cairo', sans-serif; text-align: center; color: #1E293B; }
        .border { border: 3px double #059669; padding: 40px; border-radius: 10px; }
        .title { font-size: 32px; color: #047857; margin-bottom: 20px; }
        .subtitle { font-size: 18px; color: #64748B; margin-bottom: 30px; }
        .student-name { font-size: 28px; font-weight: bold; margin: 20px 0; }
        .info { font-size: 16px; margin: 10px 0; }
        .date { margin-top: 40px; font-size: 14px; color: #94A3B8; }
    </style>
</head>
<body>
    <div class="border">
        <div class="title">شهادة إتمام</div>
        <div class="subtitle">مدرسة تحفيظ القرآن الكريم</div>
        <div class="info">تشهد مدرسة تلاوة بأن الطالب/الطالبة</div>
        <div class="student-name">{{ student.name }}</div>
        <div class="info">قد أتم {{ certificate.title }}</div>
        <div class="date">تاريخ الإصدار: {{ certificate.approved_at|date:"Y-m-d" }}</div>
    </div>
</body>
</html>
